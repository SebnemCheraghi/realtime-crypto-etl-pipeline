x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile

  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__TEST_CONNECTION: 'Enabled'

    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 9000
    CLICKHOUSE_DB: sqlserver_monitoring

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ============================================================
  # PostgreSQL - Airflow Metadata Database
  # ============================================================

  postgres:
    image: postgres:16
    container_name: airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # ClickHouse - Monitoring Data
  # ============================================================

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse_monitoring

    ports:
      - "8124:8123"
      - "9001:9000"

    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config/custom-config.xml:/etc/clickhouse-server/config.d/custom-config.xml
      - clickhouse_data:/var/lib/clickhouse

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana-enterprise:10.2.0
    container_name: grafana_monitoring

    ports:
      - "3001:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource

    depends_on:
      clickhouse:
        condition: service_started

    restart: unless-stopped


  # ============================================================
  # Airflow Initialization
  # ============================================================

  airflow-init:
    <<: *airflow-common

    container_name: airflow_init

    command:
      - bash
      - -c
      - |
        echo "Initializing Airflow database..."

        airflow db migrate

        echo "Creating Airflow admin user..."

        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-Admin}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          || true

        echo "Airflow initialization completed."

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  # ============================================================
  # Airflow Webserver
  # ============================================================

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow_webserver

    command:
      - airflow
      - webserver

    ports:
      - "8081:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      clickhouse:
        condition: service_started

    restart: unless-stopped
    

  # ============================================================
  # Airflow Scheduler
  # ============================================================

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow_scheduler

    command:
      - airflow
      - scheduler

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      clickhouse:
        condition: service_started

    restart: unless-stopped


# ==============================================================
# Volumes
# ==============================================================

volumes:
  postgres_data:
  clickhouse_data:
  grafana_data: